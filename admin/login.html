<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Aymen Phone</title>

  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo-text">
        <h1>AYMEN PHONE</h1>
        <p>STORE & SERVICES</p>
      </div>
    </div>
  </nav>

  <!-- Admin Login -->
  <div class="admin-container">
    <div class="admin-card">
      <h2 class="admin-title">Admin Login</h2>

      <form id="adminLoginForm">
        <input type="email" id="email" placeholder="Admin Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p id="errorMsg" style="color:red; display:none; margin-top:10px;">Invalid email or password</p>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('adminLoginForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault(); // prevent form from submitting

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if(email === 'aymen@gmail.com' && password === 'admin123') {
        window.location.href = 'admin-dashboard.html'; // redirect
      } else {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'block'; // show error
      }
    });
  </script>
</body>
</html>
