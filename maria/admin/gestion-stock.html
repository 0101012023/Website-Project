<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management | Aymen Phone</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="logo-text">
      <h1>AYMEN PHONE</h1>
      <p>STORE & SERVICES</p>
    </div>
  </div>
</nav>

<div class="back-dashboard">
  <a href="admin-dashboard.html"><button>Back to Dashboard</button></a>
</div>

<div class="admin-stocks-container">
  <h2>Stock Management</h2>
  <p>Live inventory from database. Add, view, or remove products.</p>
  <br>

  <div class="add-stock">
    <input type="text" id="productName" placeholder="Product Name">
    <input type="text" id="productBrand" placeholder="Brand">
    
    <select id="productCategory">
      <option value="">Loading Categories...</option>
    </select>

    <input type="number" id="productQty" placeholder="Quantity">
    <input type="number" step="0.01" id="productPrice" placeholder="Price (DA)">
    
    <div style="display: flex; flex-direction: column; gap: 5px;">
        <label style="font-size: 10px; color: #C5A059;">Main Image File:</label>
        <input type="file" id="productImage" accept="image/*">
    </div>
    
    <button id="addBtn">Add Product</button>
  </div>

  <table id="stockTable" class="stock-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Brand</th>
        <th>Category ID</th>
        <th>Quantity</th>
        <th>Price (DA)</th>
        <th>Image</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      </tbody>
  </table>
</div>



<script>
const tableBody = document.querySelector("#stockTable tbody");
const categorySelect = document.getElementById("productCategory");

// 1. Fetch Categories to populate the dropdown
async function loadCategories() {
    try {
        const response = await fetch('api/categories/get_all.php');
        const result = await response.json();
        if (result.success) {
            categorySelect.innerHTML = '<option value="">Select Category</option>';
            result.data.forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat.id; // Database ID
                opt.textContent = cat.name;
                categorySelect.appendChild(opt);
            });
        }
    } catch (err) { console.error("Category load error", err); }
}

// 2. Fetch and Render Products from database
async function fetchProducts() {
    try {
        const response = await fetch('api/products/filter.php'); 
        const result = await response.json();
        
        if (result.success) {
            renderTable(result.data);
        }
    } catch (err) { console.error("Sync failed:", err); }
}

function renderTable(products) {
    tableBody.innerHTML = "";
    products.forEach((prod) => {
        const row = tableBody.insertRow();
        row.innerHTML = `
            <td>${prod.name}</td>
            <td>${prod.brand}</td>
            <td>${prod.category_id}</td>
            <td>${prod.stock_quantity}</td>
            <td>${parseFloat(prod.price).toLocaleString()} DA</td>
            <td>
                ${prod.main_image ? `<img src="uploads/${prod.main_image}" width="50" style="border-radius:4px;">` : "No Image"}
            </td>
            <td>
                <button class="delete-btn" onclick="deleteProduct(${prod.id})">Delete</button>
            </td>
        `;
    });
}

// 3. Add Product (Using FormData for Image Upload)
document.getElementById("addBtn").addEventListener("click", async () => {
    const name = document.getElementById("productName").value.trim();
    const brand = document.getElementById("productBrand").value.trim();
    const category_id = document.getElementById("productCategory").value;
    const stock_quantity = document.getElementById("productQty").value;
    const price = document.getElementById("productPrice").value;
    const imageFile = document.getElementById("productImage").files[0];

    if (!name || !brand || !category_id || !stock_quantity || !price || !imageFile) {
        alert("Please fill all fields and select an image!");
        return;
    }

    const formData = new FormData();
    formData.append('name', name);
    formData.append('brand', brand);
    formData.append('category_id', category_id);
    formData.append('stock_quantity', stock_quantity);
    formData.append('price', price);
    formData.append('main_image', imageFile); // The file object
    formData.append('description', "Added from admin panel");

    try {
        const response = await fetch('api/products/createproduct.php', {
            method: 'POST',
            body: formData // No Headers needed, browser sets Multipart
        });
        const result = await response.json();
        
        if (result.success) {
            alert("Product created!");
            fetchProducts(); // Refresh list
            // Clear inputs
            document.getElementById("productName").value = "";
            document.getElementById("productBrand").value = "";
            document.getElementById("productCategory").value = "";
            document.getElementById("productQty").value = "";
            document.getElementById("productPrice").value = "";
            document.getElementById("productImage").value = "";
        } else {
            alert("Error: " + result.message);
        }
    } catch (err) { alert("Failed to connect to server."); }
});

// 4. Delete Product
async function deleteProduct(id) {
    if (!confirm("Are you sure?")) return;

    const formData = new FormData();
    formData.append('id', id);

    try {
        const response = await fetch('api/products/deleteproduct.php', {
            method: 'POST',
            body: formData
        });
        const result = await response.json();
        if (result.success) {
            fetchProducts();
        } else {
            alert(result.message);
        }
    } catch (err) { console.error("Delete failed", err); }
}

// Initial Load
document.addEventListener("DOMContentLoaded", () => {
    loadCategories();
    fetchProducts();
});
</script>

</body>
</html>
