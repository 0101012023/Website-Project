<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management | Aymen Phone</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-text">
                <h1>AYMEN PHONE</h1>
                <p>STORE & SERVICES</p>
            </div>
        </div>
    </nav>

    <!-- Stock Management -->
    <div class="admin-stocks-container">
        <h2>Stock Management</h2>
        <p>Here you can see all your products, add new ones, and delete them.</p>

        <!-- Add Product Form -->
        <div class="add-stock">
            <input type="text" id="productName" placeholder="Product Name">
            <input type="text" id="productBrand" placeholder="Brand">
            <input type="number" id="productQty" placeholder="Quantity">
            <input type="number" step="0.01" id="productPrice" placeholder="Price ($)">
            <button id="addBtn">Add Product</button>
        </div>

        <!-- Product Table -->
        <table id="stockTable" class="stock-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Brand</th>
                    <th>Quantity</th>
                    <th>Price ($)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Products will appear here -->
            </tbody>
        </table>
    </div>

    <script src="admin.js"></script>
</body>
</html>
